# goreleaser v2 release pipeline for nagual2/ssh3-go.
# Triggered by .github/workflows/release.yml on v* tags.
version: 2

project_name: ssh3-go

builds:
  - id: client
    main: ./cmd/ssh3
    binary: ssh3
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=mod
    # vendor/ holds the Rust h3 shim (no Go modules.txt): keep module mode
    flags:
      - -mod=mod
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm
      - goos: openbsd
        goarch: arm
      - goos: openbsd
        goarch: arm64
    tags:
      - osusergo
      - netgo
      - static_build
      - disable_password_auth
    ldflags:
      - -s -w

  # amd64 server: CGO build with the shadow/crypt password backend compiled
  # in. Password auth stays OFF by default (-enable-password-login or
  # SSH3_ENABLE_PASSWORD_LOGIN=1). Needs gcc + libcrypt-dev on the runner.
  - id: server
    main: ./cmd/ssh3-server/main.go
    binary: ssh3-server
    env:
      - CGO_ENABLED=1
      - GOFLAGS=-mod=mod
    flags:
      - -mod=mod
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
    tags:
      - osusergo
      - netgo
    ldflags:
      - -s -w

  # arm servers stay CGO-free key-only builds: CGO cross-compilation for
  # arm/arm64 would require cross toolchains on the release runner.
  - id: serverkeyonly
    main: ./cmd/ssh3-server/main.go
    binary: ssh3-server
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=mod
    flags:
      - -mod=mod
      - -trimpath
    goos:
      - linux
    goarch:
      - arm64
      - arm
    tags:
      - osusergo
      - netgo
      - static_build
      - disable_password_auth
    ldflags:
      - -s -w

  # the amd64 key-only static server: the apk entry only (the musl
  # distros cannot run the glibc CGO server, and a second
  # /usr/bin/ssh3-server would collide inside the deb/rpm entries)
  - id: serverkeyonlymusl
    main: ./cmd/ssh3-server/main.go
    binary: ssh3-server
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=mod
    flags:
      - -mod=mod
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
    tags:
      - osusergo
      - netgo
      - static_build
      - disable_password_auth
    ldflags:
      - -s -w

archives:
  - id: client
    ids:
      - client
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_client_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
  - id: server
    ids:
      - server
      - serverkeyonly
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_server_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

nfpms:
  # the glibc distros: the full set (the CGO amd64 server carries the
  # password backend, the deb's libcrypt1 / the rpm's libxcrypt ride
  # it)
  - id: ssh3-go
    package_name: ssh3-go
    ids:
      - client
      - server
      - serverkeyonly
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: nagual2
    homepage: https://github.com/nagual2/ssh3-go
    maintainer: Max <max@localhost>
    description: |-
      SSH3 - Secure Shell over QUIC/HTTP-3 (server and client).
      Password authentication is available on amd64 and disabled by default
      (enable via -enable-password-login or SSH3_ENABLE_PASSWORD_LOGIN=1
      in /etc/ssh3/ssh3-server.env). arm builds are key-only; no OIDC configured.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    dependencies:
      - openssl
      - systemd
      - libcrypt1
    overrides:
      rpm:
        dependencies:
          - openssl
          - systemd
          - libxcrypt
    replaces:
      - ssh3
    conflicts:
      - ssh3
    bindir: /usr/bin
    contents:
      - src: packaging/ssh3-server.service
        dst: /usr/lib/systemd/system/ssh3-server.service
      - src: packaging/ssh3-server.env
        dst: /etc/ssh3/ssh3-server.env
        type: config
    scripts:
      postinstall: packaging/postinst
      preremove: packaging/prerm

  # the musl distros (alpine): the static builds only - the CGO server
  # links glibc and would not run on musl, the key-only server rides
  # instead; musl keeps crypt() in libc, no libcrypt package exists
  - id: ssh3-go-apk
    package_name: ssh3-go
    ids:
      - client
      - serverkeyonly
      - serverkeyonlymusl
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: nagual2
    homepage: https://github.com/nagual2/ssh3-go
    maintainer: Max <max@localhost>
    description: |-
      SSH3 - Secure Shell over QUIC/HTTP-3 (server and client).
      The alpine server is key-only (the password backend rides the
      glibc deb/rpm builds); no OIDC configured.
    license: Apache-2.0
    formats:
      - apk
    dependencies:
      - openssl
    replaces:
      - ssh3
    conflicts:
      - ssh3
    bindir: /usr/bin
    contents:
      - src: packaging/ssh3-server.service
        dst: /usr/lib/systemd/system/ssh3-server.service
      - src: packaging/ssh3-server.env
        dst: /etc/ssh3/ssh3-server.env
        type: config
    scripts:
      postinstall: packaging/postinst
      preremove: packaging/prerm

changelog:
  disable: true
